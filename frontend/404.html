<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | Quantum Advisor</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/system.css">
<link rel="stylesheet" href="/css/auth.css">
<link rel="icon" href="/img/mark.svg" type="image/svg+xml">
<style>
  .nf { min-height: 100vh; display: grid; place-items: center; background: var(--night); color: #E7ECF5; padding: 40px 20px; text-align: center; position: relative; overflow: hidden; }
  .nf::after { content: ""; position: absolute; left: 50%; bottom: -70%; width: 120%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(closest-side, rgba(29, 108, 242, .3), rgba(29, 108, 242, 0) 70%); }
  .nf > div { position: relative; z-index: 1; max-width: 620px; }
  .nf .hub { margin: 0 auto 28px; max-width: 460px; opacity: .9; }
  .nf h1 { font-size: clamp(1.9rem, 4vw, 2.8rem); letter-spacing: -0.04em; color: #fff; line-height: 1.1; }
  .nf p { color: #A5B1C7; margin-top: 12px; }
  .nf .actions { display: flex; gap: 10px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }
  .nf .actions a { text-decoration: none; padding: 12px 20px; border-radius: 12px; font-weight: 700; }
  .nf .go { background: #fff; color: var(--ink-0); }
  .nf .alt { color: #fff; border: 1px solid rgba(255,255,255,.22); }
</style>
</head>
<body>
<main class="nf">
  <div>
    <div data-hub></div>
    <h1>No agent has this page.</h1>
    <p>The link may be old or mistyped. Nothing was lost; your analyses and holdings are where you left them.</p>
    <div class="actions"><a class="go" href="/app">Open the app</a><a class="alt" href="/">Go to the home page</a></div>
  </div>
</main>
<script src="/js/hub.js"></script>
</body>
</html>
