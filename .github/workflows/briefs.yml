# Wakes the deployed app on market days so the watchlist briefs and alerts go out even
# when the free Render instance is asleep. Free on GitHub; times are UTC (IST - 5:30).
# Needs two repository secrets: APP_URL (e.g. https://quantum-advisor.onrender.com) and
# CRON_SECRET (the same value as the CRON_SECRET environment variable on Render).
name: Watchlist briefs

on:
  schedule:
    - cron: "5 3 * * 1-5"        # 08:35 IST  morning brief
    - cron: "*/30 3-9 * * 1-5"   # every 30 min, 08:30-15:00 IST  news and price alerts
    - cron: "50 9 * * 1-5"       # 15:20 IST  closing brief (GitHub may start a few minutes late)
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the app and run what is due
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set the APP_URL and CRON_SECRET repository secrets first."; exit 0
          fi
          # A sleeping free instance takes up to a minute to start.
          curl -sS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 \
               -X POST -H "X-Cron-Key: $CRON_SECRET" "$APP_URL/api/cron/tick"
