# Keeps the free Render instance awake during the day, so a demo or an evaluator's first
# request does not wait about a minute for the server to start. Free on GitHub; times are UTC.
# Uses the APP_URL repository secret (e.g. https://quantum-advisor.onrender.com).
# Disable it after the evaluation window: a free Render service has 750 hours a month.
name: Keep the demo awake

on:
  schedule:
    - cron: "*/10 2-14 * * *"    # every 10 minutes, 07:30-20:30 IST
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the health check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "Set the APP_URL repository secret first."; exit 0; fi
          curl -sS --retry 4 --retry-delay 15 --retry-all-errors --max-time 90 "$APP_URL/api/health"
