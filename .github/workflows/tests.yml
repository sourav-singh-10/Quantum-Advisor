name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:            # the same suite also runs against Postgres, as used with DATABASE_URL
        image: postgres:16
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa
          POSTGRES_DB: qatest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qa" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on Postgres
        run: pytest -q
        env:
          QA_TEST_DATABASE_URL: postgresql://qa:qa@localhost:5432/qatest
