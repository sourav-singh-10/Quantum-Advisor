services:
  - type: web
    name: quantum-advisor
    runtime: python
    buildCommand: pip install -r requirements.txt
    # one worker + threads: the live stream holds a connection while agents run
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 180
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: MARKETSTACK_API_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
