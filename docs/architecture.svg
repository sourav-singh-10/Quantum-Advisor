<text x="450.0" y="100" text-anchor="middle" font-weight="600" font-size="14" fill="#0f172a">Planner (orchestrator)</text>
<text x="450.0" y="118" text-anchor="middle" font-size="12" fill="#475569">plans, re-plans, arbitrates</text>
