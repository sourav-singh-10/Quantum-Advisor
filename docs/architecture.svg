<text x="24" y="34" text-anchor="start" font-size="17" font-weight="600" fill="#0f172a">Quantum Advisor: planner-led agent team with a Strategy ↔ Risk critique loop</text>
<text x="24" y="54" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">LangGraph state machine · every arrow is a typed message recorded in the execution trace</text>
